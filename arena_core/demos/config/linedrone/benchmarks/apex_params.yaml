# A*pex benchmark planner (nodes/testbench/benchmarks/apex): approximate multi-objective A* (Zhang et al., ICAPS 2022) on the
# graph of MOAR-3D. The graph parameters are the ones of moar_3d_params.yaml (same graph and costs), the three terms of the
# MOAR cost (time, safety, energy) are the objectives, with a 2 m grid instead of 1 m: at 1 m, A*pex doesn't finish on
# CL_map_3 even with epsilon = 0.1 (60M nodes, ~8 GB in ~2 min, only the fastest paths found), at 2 m it ends in ~95 s.
/**:
    ros__parameters:
        apex:
            algorithm: "apex"               # apex, or toa_star (exact Tri-Objective A*, intractable on the test maps)
            epsilon: 0.1                    # Approximation factor of the three objectives
            max_time: 600.0                 # The search stops after this time in s (the solutions found are kept)
            max_nodes: 60000000             # The search stops after generating this number of nodes (memory)
        moar_3d:
            grid_resolution: 2.0            # Size of the grid cells in m (MOAR-3D: 1.0, intractable for A*pex)
            clearance: 0.8                  # Valid cells: same clearance as the RRT of ARENA (OMPLStateValidityChecker)
            sdf_min_distance: 2.0           # d_min and d_max of the collision cost C(d) of the SDF octomap
            sdf_max_distance: 9.0           # (costmap_3D_params.yaml obstacle_influence_distance)
            speeds:                         # Speeds of the MOAR implementation relative to the horizontal cruising speed
                min_ratio: 0.8333           # v_MIN = 0.5 / 0.6
                up_ratio: 0.9667            # 0.58 / 0.6
                diagonal_up_ratio: 0.95     # 0.57 / 0.6
                diagonal_down_ratio: 0.9667 # 0.58 / 0.6
                down_ratio: 0.95            # 0.57 / 0.6
                d_min: 2.0                  # v_sat = v_MIN below this obstacle distance (m)
                d_max: 4.0                  # v_sat = v_MAX above this obstacle distance (m, d_max_speed of MOAR)
