# Spline NSGA-II benchmark planner (nodes/testbench/benchmarks/spline_nsga2), Ahmed and Deb (ROBIO 2011, Soft Comput. 2013).
# Objectives of the paper (path length, path potential), the population size and the number of generations are the ones
# of ARENA (linedrone_problem_params.yaml), the testbench can change them.
/**:
    ros__parameters:
        spline_nsga2:
            nb_of_control_points: 8         # Free control points of the B-spline (5 to 8 in the paper)
            curve_samples: 100              # Points of the curve for the objectives (numerical approximation)
            evaluation_curve_samples: 1000  # Points of the curve of the reported trajectories
            mutation_probability: 0.05      # 0.03 to 0.08 in the paper
            crossover_probability: 0.95     # Same as ARENA
            penalty_coefficient: 1.0        # Objectives multiplied by 1 + coefficient * number of obstacles crossed
        benchmark:
            speed: 0.5                      # Constant speed of the path (robot.max_speed)
